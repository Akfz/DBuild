name: Publish Maven

on:
  push:
    branches:
      - 'Release_*'
      - 'Dev_*'      
  workflow_dispatch:   

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and Publish Common to local folder
        run: ./gradlew :common:publish -Ppublishing-dir=build/repo

      - name: Deploy Maven to branch
        uses: jamesives/github-pages-deploy-action@v4
        with:
          folder: build/repo
          branch: maven