plugins {
    id 'java-library'
    id 'eclipse'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'v.akfz'
version = project.version 

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

eclipse {
    classpath {
        file {
            whenMerged { classpath ->
                classpath.entries.each { entry ->
                    if (entry.kind == 'con' && entry.path.contains('JRE_CONTAINER')) {
                        entry.accessRules.add(new org.gradle.plugins.ide.eclipse.model.AccessRule('accessible', 'com/sun/tools/javac/**'))
                    }
                }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        '--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
    ]
}

dependencies {
    implementation 'com.squareup:javapoet:1.13.0'
}

shadowJar {
    archiveClassifier.set('')
    relocate 'com.squareup.javapoet', 'v.akfz.db.generator.shadow.javapoet'
}

tasks.build {
    dependsOn tasks.shadowJar
}