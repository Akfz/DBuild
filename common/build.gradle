plugins {
    id 'fabric-loom'
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-common"
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

sourceSets {
    compiler {
        java {
            srcDirs = ['src/compiler/java']
        }
        resources {
            srcDirs = ['src/compiler/resources']
        }
    }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

tasks.named('compileJava') {
    dependsOn tasks.named('compileCompilerJava')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    mappings loom.layered() {
        officialMojangMappings()
        def pMc = project.findProperty('parchment_mc_version') ?: project.minecraft_version
        def pVer = project.findProperty('parchment_version') ?: ''
        if (pVer) {
            parchment("org.parchmentmc.data:parchment-${pMc}:${pVer}@zip")
        }
    }

    compileOnly "org.spongepowered:mixin:${project.mixin_version}"
    compileOnly "org.ow2.asm:asm:9.6"
    compileOnly "org.ow2.asm:asm-tree:9.6"

    def mixinExtrasVer = project.findProperty('mixinextras_version') ?: '0.4.1'
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"

    compileOnly sourceSets.compiler.output
    annotationProcessor sourceSets.compiler.output
}

tasks.named('processResources', ProcessResources).configure {
    inputs.properties rootProject.ext.modProperties

    filesMatching('fabric.mod.json') {
        expand rootProject.ext.modProperties
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${project.archives_base_name}-common"
            from components.java
        }
    }
    repositories {
        if (project.hasProperty('publishing-dir')) {
            maven {
                url = rootProject.file(project.property('publishing-dir'))
            }
        }
    }
}